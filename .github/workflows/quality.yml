name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for accessibility checks
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run quality checks
        run: pnpm check

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check generated Pydantic contracts
        run: uv run python scripts/check_python_contract_models.py
      - name: Run Ruff lint
        run: uv run ruff check .
      - name: Check Ruff formatting
        run: uv run ruff format --check .
      - name: Run mypy
        run: uv run mypy .
      - name: Run pytest
        run: uv run pytest

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Apply committed database migrations
        run: |
          docker compose --env-file .env.example up -d --wait postgres
          for migration in packages/database/drizzle/[0-9][0-9][0-9][0-9]_*.sql; do
            cat "$migration" | docker compose --env-file .env.example exec -T postgres psql -v ON_ERROR_STOP=1 -U pantaetl -d pantaetl
          done
