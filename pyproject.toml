[project]
name = "pantaetl"
version = "0.0.0"
description = "Self-hosted ETL platform for analysts and data scientists."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
