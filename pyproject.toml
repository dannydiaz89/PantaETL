[project]
name = "pantaetl"
version = "0.0.0"
description = "Self-hosted ETL platform for analysts and data scientists."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "cryptography>=46.0.0",
    "polars>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=19.0.0",
    "pydantic>=2.12.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.45.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"workers/python/generated/*.py" = ["UP045"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["workers.python.generated.*"]
disable_error_code = ["valid-type"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]
