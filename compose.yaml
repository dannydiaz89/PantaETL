name: pantaetl

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB.}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantaetl -d pantaetl"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: web
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER.}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD.}@postgres:5432/${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB.}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Copy .env.example to .env and set BETTER_AUTH_SECRET.}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Copy .env.example to .env and set BETTER_AUTH_URL.}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:?Copy .env.example to .env and set BETTER_AUTH_TRUSTED_ORIGINS.}
      GARBAGE_COLLECTOR_HEALTH_URL: http://garbage-collector:3011/health
      SCHEDULER_HEALTH_URL: http://scheduler:3010/health
      SCHEDULER_INTERNAL_TOKEN: ${SCHEDULER_INTERNAL_TOKEN:?Copy .env.example to .env and set SCHEDULER_INTERNAL_TOKEN.}
      SCHEDULER_RUN_URL: http://scheduler:3010/internal/pipeline-runs
      WORKER_HEALTH_URL: http://worker:3020/health
      STORAGE_ROOT: /var/lib/pantaetl/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - app-storage:/var/lib/pantaetl/storage

  scheduler:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: scheduler
    environment:
      HOST: 0.0.0.0
      PORT: 3010
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER.}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD.}@postgres:5432/${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB.}
      SCHEDULER_INTERNAL_TOKEN: ${SCHEDULER_INTERNAL_TOKEN:?Copy .env.example to .env and set SCHEDULER_INTERNAL_TOKEN.}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3010:3010"

  worker:
    build:
      context: .
      dockerfile: docker/python-worker.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3020
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER.}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD.}@postgres:5432/${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB.}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3020:3020"
    volumes:
      - app-storage:/var/lib/pantaetl/storage

  garbage-collector:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: garbage-collector
    environment:
      HOST: 0.0.0.0
      PORT: 3011
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER.}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD.}@postgres:5432/${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB.}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3011:3011"
    volumes:
      - app-storage:/var/lib/pantaetl/storage

volumes:
  postgres-data:
  app-storage:
