name: pantaetl

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pantaetl
      POSTGRES_USER: pantaetl
      POSTGRES_PASSWORD: pantaetl-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantaetl -d pantaetl"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: web
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://pantaetl:pantaetl-dev@postgres:5432/pantaetl
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - app-storage:/var/lib/pantaetl/storage

  scheduler:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: scheduler
    environment:
      HOST: 0.0.0.0
      PORT: 3010
      DATABASE_URL: postgresql://pantaetl:pantaetl-dev@postgres:5432/pantaetl
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3010:3010"

  worker:
    build:
      context: .
      dockerfile: docker/python-worker.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3020
      DATABASE_URL: postgresql://pantaetl:pantaetl-dev@postgres:5432/pantaetl
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3020:3020"
    volumes:
      - app-storage:/var/lib/pantaetl/storage

  garbage-collector:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: garbage-collector
    environment:
      HOST: 0.0.0.0
      PORT: 3011
      DATABASE_URL: postgresql://pantaetl:pantaetl-dev@postgres:5432/pantaetl
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3011:3011"
    volumes:
      - app-storage:/var/lib/pantaetl/storage

volumes:
  postgres-data:
  app-storage:
